<!DOCTYPE html>
<html lang="ca" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pràctica de la Taula Periòdica - Química</title>
  
  <!-- Favicon personalitzat -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0369a1',
              900: '#0c4a6e',
            }
          },
          gridTemplateColumns: {
            '18': 'repeat(18, minmax(0, 1fr))',
          }
        }
      }
    }
  </script>

  <!-- KaTeX per a notació científica i matemàtica -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

  <style>
    .pt-grid {
      display: grid;
      grid-template-columns: repeat(18, minmax(0, 1fr));
      gap: 3px;
    }

    .element-cell {
      aspect-ratio: 0.95;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2px;
      border-radius: 4px;
      font-size: 0.75rem;
      user-select: none;
      transition: all 0.2s ease;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0f172a;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between">

  <!-- CAPÇALERA -->
  <header class="bg-slate-900 border-b border-slate-800 p-3 shadow-md">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-sky-500/10 border border-sky-500/30 rounded-lg">
          <svg class="w-6 h-6 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path>
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-bold text-sky-400 leading-tight">Taula Periòdica Interactiva</h1>
          <p class="text-xs text-slate-400">Física i Química — Secundària i Batxillerat</p>
        </div>
      </div>

      <!-- SELECTOR DE MODE -->
      <div class="flex items-center gap-2 bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
        <button id="mode-sym-name" onclick="setGameMode('sym-name')" class="px-3 py-1.5 rounded-md font-medium transition-colors bg-sky-600 text-white">Símbol → Nom</button>
        <button id="mode-name-sym" onclick="setGameMode('name-sym')" class="px-3 py-1.5 rounded-md font-medium transition-colors text-slate-400 hover:text-slate-200">Nom → Símbol</button>
        <button id="mode-mixed" onclick="setGameMode('mixed')" class="px-3 py-1.5 rounded-md font-medium transition-colors text-slate-400 hover:text-slate-200">Mixt</button>
        <button id="mode-study" onclick="setGameMode('study')" class="px-3 py-1.5 rounded-md font-medium transition-colors text-slate-400 hover:text-slate-200">Explorador</button>
      </div>

      <!-- MARCADOR I ACCIONS -->
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-4 bg-slate-800/80 px-4 py-1.5 rounded-lg border border-slate-700 text-xs font-semibold">
          <div class="text-emerald-400">Encerts: <span id="score-correct">0</span></div>
          <div class="text-rose-400">Errors: <span id="score-incorrect">0</span></div>
          <div class="text-amber-400">Ratxa: <span id="score-streak">0</span> 🔥</div>
        </div>

        <div class="flex items-center gap-2">
          <!-- Botó Veure Errades -->
          <button id="btn-mistakes" onclick="openMistakesModal()" class="bg-rose-950/60 hover:bg-rose-900/80 text-rose-300 border border-rose-800/60 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
            <span id="mistakes-count-label">Errades (0)</span>
          </button>

          <!-- Botó Reiniciar -->
          <button onclick="restartGame()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            <span>Reiniciar</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- SECCIÓ SUPERIOR: PANELL DE PREGUNTA I INTERACCIÓ -->
  <main class="max-w-7xl mx-auto w-full px-3 py-3 flex-grow flex flex-col gap-3">
    
    <div id="question-card" class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-xl transition-all">
      <div class="flex flex-col md:flex-row items-center justify-between gap-4">
        
        <!-- Targeta de Pregunta -->
        <div class="flex items-center gap-4 w-full md:w-auto">
          <div id="target-display-box" class="w-20 h-20 bg-sky-950/80 border-2 border-sky-500/50 rounded-xl flex flex-col items-center justify-center shadow-lg relative">
            <span id="target-z-katex" class="absolute top-1 left-2 text-[10px] text-sky-300 font-mono"></span>
            <span id="target-main-text" class="text-2xl font-black text-white"></span>
          </div>
          <div>
            <span id="question-prompt-type" class="text-xs uppercase tracking-wider text-sky-400 font-semibold"></span>
            <h2 id="question-text" class="text-lg font-bold text-slate-100"></h2>
            <p id="group-period-hint" class="text-xs text-slate-400 mt-0.5"></p>
          </div>
        </div>

        <!-- Formulari d'Entrada -->
        <div id="interaction-form" class="w-full md:w-auto flex-1 max-w-md flex flex-col gap-2">
          <div class="flex gap-2">
            <input type="text" id="user-input" placeholder="Escriu la teva resposta..." autocomplete="off" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 font-medium text-sm transition-all">
            <button id="btn-action" onclick="handleUserSubmit()" class="bg-sky-600 hover:bg-sky-500 text-white font-semibold px-5 py-2.5 rounded-lg transition-colors text-sm flex items-center gap-1.5 shrink-0 shadow-md">
              <span>Comprovar</span>
              <kbd class="hidden sm:inline-block bg-sky-800/80 px-1.5 py-0.5 rounded text-[10px] text-sky-200">Enter</kbd>
            </button>
          </div>
          <!-- Retroalimentació pedagògica -->
          <div id="feedback-message" class="min-h-[24px] text-xs font-medium px-1 flex items-center gap-1.5"></div>
        </div>

      </div>
    </div>

    <!-- SECCIÓ INFERIOR: TAULA PERIÒDICA DE 18 COLUMNES -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-3 shadow-2xl overflow-x-auto custom-scrollbar">
      
      <!-- Encapçalats de columnes (Grups 1 a 18) -->
      <div class="pt-grid min-w-[850px] text-center text-[10px] text-slate-400 font-mono mb-1">
        <div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div>
        <div>7</div><div>8</div><div>9</div><div>10</div><div>11</div><div>12</div>
        <div>13</div><div>14</div><div>15</div><div>16</div><div>17</div><div>18</div>
      </div>

      <!-- Graella principal de la Taula Periòdica -->
      <div id="periodic-table-grid" class="pt-grid min-w-[850px]"></div>

    </div>

  </main>

  <!-- MODAL D'ERRADES -->
  <div id="mistakes-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-xl max-w-md w-full p-5 shadow-2xl flex flex-col gap-4 max-h-[80vh]">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-base font-bold text-rose-400 flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
          <span>Historial d'Errades Realitzades</span>
        </h3>
        <button onclick="closeMistakesModal()" class="text-slate-400 hover:text-white font-bold p-1 rounded">✕</button>
      </div>
      
      <div id="mistakes-list" class="overflow-y-auto flex-grow flex flex-col gap-2 pr-1 custom-scrollbar">
        <!-- Es construeix dinàmicament per JS -->
      </div>

      <div class="flex justify-end pt-2 border-t border-slate-800">
        <button onclick="closeMistakesModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg text-xs font-semibold">Tancar</button>
      </div>
    </div>
  </div>

  <!-- PEU DE PÀGINA -->
  <footer class="bg-slate-900/50 border-t border-slate-800/60 py-2 px-4 text-center text-xs text-slate-500">
    Aplicació Educativa de Química — Dissenyada per a GitHub Pages
  </footer>

      { z: 8, name: 'Oxigen', symbol: 'O', group: 16, period: 2 },

      { z: 34, name: 'Seleni', symbol: 'Se', group: 16, period: 4 },
      { z: 52, name: 'Tel·luri', symbol: 'Te', group: 16, period: 5 },

      // Grup 17
      { z: 9, name: 'Fluor', symbol: 'F', group: 17, period: 2 },
      { z: 17, name: 'Clor', symbol: 'Cl', group: 17, period: 3 },
      { z: 35, name: 'Brom', symbol: 'Br', group: 17, period: 4 },
      { z: 53, name: 'Iode', symbol: 'I', group: 17, period: 5 },
      { z: 85, name: 'Àstat', symbol: 'At', group: 17, period: 6 },
      // Grup 18
      { z: 2, name: 'Heli', symbol: 'He', group: 18, period: 1 },
      { z: 10, name: 'Neó', symbol: 'Ne', group: 18, period: 2 },
      { z: 18, name: 'Argó', symbol: 'Ar', group: 18, period: 3 },
      { z: 36, name: 'Criptó', symbol: 'Kr', group: 18, period: 4 },
      { z: 54, name: 'Xenó', symbol: 'Xe', group: 18, period: 5 },
      { z: 86, name: 'Radó', symbol: 'Rn', group: 18, period: 6 },
      // Lantanoides
      { z: 57, name: 'Lantani', symbol: 'La', group: 3, period: 9 },
      // Actinoides
      { z: 89, name: 'Actini', symbol: 'Ac', group: 3, period: 10 },
      { z: 92, name: 'Urani', symbol: 'U', group: 6, period: 10 },
      { z: 94, name: 'Plutoni', symbol: 'Pu', group: 8, period: 10 }
    ];

    // Estat de l'aplicació
    let currentMode = 'sym-name';
    let currentQuestionType = 'sym-name';
    let currentElement = null;
    let gameState = 'asking';
    let stats = { correct: 0, incorrect: 0, streak: 0 };
    
    let questionQueue = [];
    let mistakes = []; // Registre d'errades acumulades

    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function initQuestionQueue() {
      questionQueue = shuffleArray(elementsData);
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderPeriodicTableGrid();
      setupEventListeners();
      initQuestionQueue();
      nextQuestion();
    });

    function renderPeriodicTableGrid() {
      const grid = document.getElementById('periodic-table-grid');
      grid.innerHTML = '';

      elementsData.forEach(el => {
        const cell = document.createElement('div');
        cell.id = `cell-${el.z}`;
        cell.className = 'element-cell border transition-all cursor-pointer';
        cell.style.gridColumn = el.group;
        cell.style.gridRow = el.period;
        cell.onclick = () => onCellClick(el);
        grid.appendChild(cell);
      });
    }

    function updateGridDisplay() {
      elementsData.forEach(el => {
        const cell = document.getElementById(`cell-${el.z}`);
        if (!cell) return;

        const isActive = currentElement && currentElement.z === el.z;

        if (currentMode === 'study') {
          cell.className = 'element-cell bg-slate-800/90 border-slate-700 text-slate-200 hover:bg-sky-900/60 hover:border-sky-500';
          cell.innerHTML = `
            <span class="text-[9px] text-slate-400 font-mono w-full text-left pl-0.5">${el.z}</span>
            <span class="font-bold text-xs text-sky-300">${el.symbol}</span>
            <span class="text-[8px] text-slate-300 truncate w-full text-center px-0.5">${el.name}</span>
          `;
        } else {
          if (isActive) {
            cell.className = 'element-cell bg-sky-600 border-2 border-sky-300 text-white font-bold shadow-lg shadow-sky-500/30 scale-105 z-10';
            if (currentQuestionType === 'sym-name') {
              cell.innerHTML = `
                <span class="text-[9px] text-sky-200 font-mono w-full text-left pl-0.5">${el.z}</span>
                <span class="font-extrabold text-sm text-white">${el.symbol}</span>
                <span class="text-[8px] text-sky-200 font-mono">?</span>
              `;
            } else {
              cell.innerHTML = `
                <span class="text-[9px] text-sky-200 font-mono w-full text-left pl-0.5">${el.z}</span>
                <span class="text-[9px] font-bold text-white text-center leading-tight px-0.5 mt-1">${el.name}</span>
                <span class="text-[8px] text-sky-200 font-mono">?</span>
              `;
            }
          } else {
            cell.className = 'element-cell bg-slate-900/40 border-slate-800/80 text-slate-600 opacity-60 hover:opacity-100';
            cell.innerHTML = `
              <span class="text-[8px] font-mono text-slate-600/60">${el.z}</span>
            `;
          }
        }
      });
    }

    function setGameMode(mode) {
      currentMode = mode;
      initQuestionQueue();

      const buttons = {
        'sym-name': document.getElementById('mode-sym-name'),
        'name-sym': document.getElementById('mode-name-sym'),
        'mixed': document.getElementById('mode-mixed'),
        'study': document.getElementById('mode-study')
      };

      Object.keys(buttons).forEach(key => {
        if (key === mode) {
          buttons[key].className = 'px-3 py-1.5 rounded-md font-medium transition-colors bg-sky-600 text-white';
        } else {
          buttons[key].className = 'px-3 py-1.5 rounded-md font-medium transition-colors text-slate-400 hover:text-slate-200';
        }
      });

      nextQuestion();
    }

    function nextQuestion() {
      gameState = 'asking';

      if (currentMode === 'study') {
        currentQuestionType = 'study';
        if (!currentElement) currentElement = elementsData[0];
      } else {
        if (questionQueue.length === 0) {
          initQuestionQueue();
        }
        currentElement = questionQueue.pop();

        if (currentMode === 'mixed') {
          currentQuestionType = Math.random() < 0.5 ? 'sym-name' : 'name-sym';
        } else {
          currentQuestionType = currentMode;
        }
      }

      const input = document.getElementById('user-input');
      const feedback = document.getElementById('feedback-message');
      const btn = document.getElementById('btn-action');

      input.value = '';
      input.disabled = (currentMode === 'study');
      feedback.innerHTML = '';
      
      btn.innerHTML = `<span>Comprovar</span><kbd class="hidden sm:inline-block bg-sky-800/80 px-1.5 py-0.5 rounded text-[10px] text-sky-200">Enter</kbd>`;
      btn.className = 'bg-sky-600 hover:bg-sky-500 text-white font-semibold px-5 py-2.5 rounded-lg transition-colors text-sm flex items-center gap-1.5 shrink-0 shadow-md';

      const promptType = document.getElementById('question-prompt-type');
      const questionText = document.getElementById('question-text');
      const hintText = document.getElementById('group-period-hint');
      const targetMainText = document.getElementById('target-main-text');

      katex.render(`Z = ${currentElement.z}`, document.getElementById('target-z-katex'), { displayMode: false });

      if (currentMode === 'study') {
        promptType.textContent = 'Explorador Didàctic';
        questionText.textContent = `${currentElement.name} (${currentElement.symbol})`;
        targetMainText.textContent = currentElement.symbol;
        hintText.textContent = `Grup ${currentElement.group} • Període ${currentElement.period > 7 ? 'Especial' : currentElement.period}`;
      } else if (currentQuestionType === 'sym-name') {
        promptType.textContent = 'Símbol ➔ Nom';
        questionText.textContent = `Quin és el nom en català de l'element amb símbol ${currentElement.symbol}?`;
        targetMainText.textContent = currentElement.symbol;
        hintText.textContent = `Ubicació: Grup ${currentElement.group}, Període ${currentElement.period > 7 ? 'Especial' : currentElement.period}`;
      } else {
        promptType.textContent = 'Nom ➔ Símbol';
        questionText.textContent = `Quin és el símbol químic de l'element ${currentElement.name}?`;
        targetMainText.textContent = '?';
        hintText.textContent = `Ubicació: Grup ${currentElement.group}, Període ${currentElement.period > 7 ? 'Especial' : currentElement.period}`;
      }

      updateGridDisplay();

      if (currentMode !== 'study') {
        setTimeout(() => input.focus(), 50);
      }
    }

    function handleUserSubmit() {
      if (currentMode === 'study') return;

      if (gameState === 'asking') {
        evaluateAnswer();
      } else {
        nextQuestion();
      }
    }

    // Normalització auxiliar només per indicar la causa de l'error ortogràfic
    function normalizeTextForHint(str) {
      return str
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/·/g, "");
    }

    function evaluateAnswer() {
      const input = document.getElementById('user-input');
      const userVal = input.value.trim();
      const feedback = document.getElementById('feedback-message');
      const btn = document.getElementById('btn-action');

      if (!userVal) {
        feedback.className = 'min-h-[24px] text-xs font-medium text-amber-400';
        feedback.textContent = 'Per favor, escriu una resposta abans de comprovar.';
        return;
      }

      let isCorrect = false;
      let warningNote = '';
      const expected = currentQuestionType === 'sym-name' ? currentElement.name : currentElement.symbol;

      if (currentQuestionType === 'sym-name') {
        // Criteri de correcció estricte (accents, ela geminada l·l i dobles s)
        if (userVal.toLowerCase() === currentElement.name.toLowerCase()) {
          isCorrect = true;
        } else {
          isCorrect = false;
          // Si la resposta coincideix només treient accents/caràcters, s'especifica l'error ortogràfic
          if (normalizeTextForHint(userVal) === normalizeTextForHint(currentElement.name)) {
            warningNote = ' — Atenció: les faltes d\'accentuació o grafia (com l·l o dobles s) es consideren errors.';
          }
        }
      } else {
        // Criteri estricte IUPAC per a símbols (1a majúscula, 2a minúscula)
        if (userVal === currentElement.symbol) {
          isCorrect = true;
        } else if (userVal.toLowerCase() === currentElement.symbol.toLowerCase()) {
          isCorrect = false;
          warningNote = ' — Recorda la norma IUPAC: la 1a lletra majúscula i la 2a minúscula.';
        }
      }

      gameState = 'feedback';

      if (isCorrect) {
        stats.correct++;
        stats.streak++;
        playTone(600, 'sine', 0.15);
        feedback.className = 'min-h-[24px] text-xs font-semibold text-emerald-400';
        feedback.innerHTML = `✓ Excel·lent! Resposta correcta.`;
      } else {
        stats.incorrect++;
        stats.streak = 0;
        playTone(220, 'sawtooth', 0.25);
        feedback.className = 'min-h-[24px] text-xs font-semibold text-rose-400';
        feedback.innerHTML = `✗ Incorrecte. La resposta correcta és **${expected}**.${warningNote}`;

        // Registre de l'errada comès
        mistakes.push({
          element: currentElement,
          userAnswer: userVal,
          correctAnswer: expected,
          questionType: currentQuestionType
        });
        updateMistakesCountUI();
      }

      document.getElementById('score-correct').textContent = stats.correct;
      document.getElementById('score-incorrect').textContent = stats.incorrect;
      document.getElementById('score-streak').textContent = stats.streak;

      btn.innerHTML = `<span>Següent</span><kbd class="hidden sm:inline-block bg-sky-800/80 px-1.5 py-0.5 rounded text-[10px] text-sky-200">Enter</kbd>`;
      btn.className = 'bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-5 py-2.5 rounded-lg transition-colors text-sm flex items-center gap-1.5 shrink-0 shadow-md';
      
      btn.focus();
    }

    function restartGame() {
      stats = { correct: 0, incorrect: 0, streak: 0 };
      mistakes = [];

      document.getElementById('score-correct').textContent = '0';
      document.getElementById('score-incorrect').textContent = '0';
      document.getElementById('score-streak').textContent = '0';
      updateMistakesCountUI();

      initQuestionQueue();
      nextQuestion();
    }

    function updateMistakesCountUI() {
      document.getElementById('mistakes-count-label').textContent = `Errades (${mistakes.length})`;
    }

    function openMistakesModal() {
      const modal = document.getElementById('mistakes-modal');
      const list = document.getElementById('mistakes-list');
      list.innerHTML = '';

      if (mistakes.length === 0) {
        list.innerHTML = `
          <div class="text-center py-8 flex flex-col items-center gap-2">
            <span class="text-2xl">🎉</span>
            <p class="text-xs text-slate-400 font-medium">No has comès cap errada encara!</p>
          </div>
        `;
      } else {
        mistakes.forEach((item, index) => {
          const div = document.createElement('div');
          div.className = 'bg-slate-950 p-3 rounded-lg border border-slate-800 flex justify-between items-center text-xs gap-2';
          
          const promptDesc = item.questionType === 'sym-name' 
            ? `Nom de <strong class="text-sky-300">${item.element.symbol}</strong> (Z=${item.element.z})` 
            : `Símbol de <strong class="text-sky-300">${item.element.name}</strong> (Z=${item.element.z})`;
          
          div.innerHTML = `
            <div>
              <p class="text-slate-300 font-medium">${index + 1}. ${promptDesc}</p>
              <p class="text-rose-400 text-[11px] mt-0.5">La teva resposta: <span class="line-through opacity-80">${item.userAnswer}</span></p>
            </div>
            <div class="text-right shrink-0">
              <span class="text-emerald-400 font-bold bg-emerald-950/60 border border-emerald-800/60 px-2.5 py-1 rounded-md text-[11px]">
                ${item.correctAnswer}
              </span>
            </div>
          `;
          list.appendChild(div);
        });
      }

      modal.classList.remove('hidden');
    }

    function closeMistakesModal() {
      document.getElementById('mistakes-modal').classList.add('hidden');
    }

    function onCellClick(element) {
      if (currentMode === 'study') {
        currentElement = element;
        nextQuestion();
      }
    }

    function setupEventListeners() {
      const input = document.getElementById('user-input');
      
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleUserSubmit();
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && gameState === 'feedback') {
          e.preventDefault();
          handleUserSubmit();
        }
        if (e.key === 'Escape') {
          closeMistakesModal();
        }
      });
    }

    function playTone(freq, type, duration) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }
  </script>

</body>
